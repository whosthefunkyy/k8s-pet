apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: go-api-hpa
  namespace: dev
  labels:
    app: go-api
    project: my-k8s-infra
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: go-api
  minReplicas: 2     
  maxReplicas: 5      
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
 